name: Keep Supabase awake

# Free Supabase projects pause after 7 days without database activity. This
# runs a tiny real query twice a week (Monday and Thursday), so the project is
# never idle for more than 4 days. Every two weeks would be too slow — the
# project would pause in between.
on:
  schedule:
    - cron: '17 14 * * 1,4' # 14:17 UTC = 6:17 or 7:17 AM Pacific
  # Run it by hand from the Actions tab to check it works.
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query site_settings
        env:
          # The same two secrets the deploy uses. The anon key is public by
          # design; site_settings is readable by everyone under RLS.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          auth=()
          case "$SUPABASE_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_KEY") ;; esac
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" "${auth[@]}"
          echo
          echo "Supabase answered — the project stays awake."
