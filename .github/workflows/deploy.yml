name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy after changing a repository variable, without a commit.
  workflow_dispatch:

# Pages needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win, but never cancel a deploy that is already applying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` from the lockfile: reproducible and faster than `npm install`.
      - run: npm ci

      - name: Build
        env:
          # Where the site is served from. Set these as repository variables
          # (Settings → Secrets and variables → Actions → Variables) when you
          # move to the custom domain. Defaults suit mathcosine.github.io/sfmo.
          SITE_BASE: ${{ vars.SITE_BASE || '/sfmo/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://mathcosine.github.io/sfmo/' }}
          # The anon key is designed to be public — it ends up in the JS bundle
          # either way. It lives in Secrets so it stays out of build logs.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Pages serves the apex of the artifact, so CNAME has to be inside it.
      - name: Add CNAME for the custom domain
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      # NOTE: Pages must be switched on by a repo admin first —
      # Settings -> Pages -> Source -> "GitHub Actions". The Actions token
      # cannot create the Pages site itself ("Resource not accessible by
      # integration"), so `enablement: true` does not help here.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
